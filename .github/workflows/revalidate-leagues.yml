name: Refresh league pages

# Every 30 minutes, asks the site to compare each domestic league's ESPN data
# with the cached copy its pages are built from (src/app/api/revalidate/leagues):
# when new results are in, the league page and every club page of that league
# are revalidated together, so they all show the same, new chances. Needs the
# REVALIDATE_TOKEN secret here and the same value in the Vercel project's
# environment; without the secret the job does nothing (the pages still refresh
# hourly on their own). The site is SITE_URL (a repository variable) or
# https://footsimu.com.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: revalidate-leagues
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
      SITE: ${{ vars.SITE_URL || 'https://footsimu.com' }}
    steps:
      - name: Revalidate leagues with new results
        run: |
          if [ -z "$TOKEN" ]; then
            echo "REVALIDATE_TOKEN is not set: nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $TOKEN" \
            "$SITE/api/revalidate/leagues"
