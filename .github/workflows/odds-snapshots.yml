name: Odds snapshots

# After each completed round of each domestic league, every club's season
# chances are added to src/data/snapshots/<CODE>.json (scripts/snapshot-odds.ts)
# and committed to main. Runs every six hours; a run with no newly completed
# round commits nothing.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshots
      - name: Commit new snapshots
        run: |
          if [ -z "$(git status --porcelain -- src/data/snapshots)" ]; then
            echo "No new snapshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/snapshots
          git commit -m "Odds snapshots $(date -u +%Y-%m-%d)"
          # main may have moved while the job ran.
          git pull --rebase origin main
          git push origin HEAD:main
